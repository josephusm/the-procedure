name: Deploy static Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    name: Deploy static site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Write deployment provenance trace
        run: |
          generated_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cat > provenance.txt <<EOF
          The Procedure — deployment provenance trace

          Version: 0.4.0
          Generated: ${generated_at}

          Canonical URL:
          https://josephusm.github.io/the-procedure/

          Source repository:
          https://github.com/josephusm/the-procedure

          Source branch:
          main

          Source revision:
          ${GITHUB_SHA}

          Deployment workflow:
          Deploy static Pages

          Artifact manifest:
          https://josephusm.github.io/the-procedure/artifact-manifest.txt

          Workflow run:
          https://github.com/josephusm/the-procedure/actions/runs/${GITHUB_RUN_ID}

          Continuity custody:
          The live page is maintained as a static public object through the source repository, Pages deployment, public traces, known errata history, and future maintainers.
          https://josephusm.github.io/the-procedure/maintenance.txt

          Errata / correction history:
          https://josephusm.github.io/the-procedure/errata.txt

          Reuse boundary:
          https://josephusm.github.io/the-procedure/reuse.txt

          Recovery route:
          Broken traces, reuse-boundary failures, source/provenance/artifact mismatches, warmed doorway regressions, and failed deployments are compared against this provenance record and corrected by roll-forward or rollback through source history and Pages deployment before 1.0.0.
          https://josephusm.github.io/the-procedure/maintenance.txt

          Correction surface:
          https://github.com/josephusm/the-procedure/issues

          Structured intake:
          https://github.com/josephusm/the-procedure/issues/new/choose

          Uncategorized intake:
          https://github.com/josephusm/the-procedure/issues/new

          Pre-release playtest standing:
          Cold-run playtest pressure filed before 1.0.0 is part of release review when it names a weak case, broken ending, warmed doorway, unreadable surface, or drag point.

          Pre-classification standing:
          Blank uncategorized issues filed before 1.0.0 remain part of release review when they identify a defect, pressure mark, broken trace, or source/provenance/artifact discrepancy before it fits a form. This removes the classification gate, not the GitHub account/session gate.

          Account boundary:
          GitHub issue filing may require a GitHub account or active session. If that boundary blocks release-relevant outside pressure before 1.0.0, the boundary itself belongs in review.

          Pre-release review window:
          https://josephusm.github.io/the-procedure/review-window.txt

          Data boundary:
          No accounts, cookies, analytics, tracking pixels, localStorage, remote gameplay telemetry, or server-side game state.
          https://josephusm.github.io/the-procedure/privacy.txt

          License:
          CC BY-NC-SA 4.0
          https://creativecommons.org/licenses/by-nc-sa/4.0/
          EOF

      - name: Write artifact manifest trace
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import os
          from datetime import datetime, timezone

          files = [
              'index.html', 'style.css', 'manifest.json', 'favicon.svg',
              'robots.txt', 'sitemap.xml', 'privacy.txt', 'status.txt',
              'provenance.txt', 'maintenance.txt', 'review-window.txt',
              'errata.txt', 'reuse.txt', 'data/cases.json',
              'src/audio.js', 'src/cases.js', 'src/compliance.js',
              'src/engine.js', 'src/renderer.js', 'src/scale.js',
              'assets/meta/og-image.png', 'README.md', 'LICENSE', 'COPYRIGHT'
          ]
          root = Path('.')
          generated_at = datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          lines = [
              'The Procedure — artifact manifest trace',
              '',
              'Version: 0.4.0',
              f'Generated: {generated_at}',
              '',
              'Canonical URL:',
              'https://josephusm.github.io/the-procedure/',
              '',
              'Source repository:',
              'https://github.com/josephusm/the-procedure',
              '',
              'Source branch:',
              'main',
              '',
              'Source revision:',
              os.environ.get('GITHUB_SHA', 'local'),
              '',
              'Workflow run:',
              f"https://github.com/josephusm/the-procedure/actions/runs/{os.environ.get('GITHUB_RUN_ID', 'local')}",
              '',
              'Boundary:',
              'This manifest is a dull checksum handle for the public static artifact. It does not remove the need for source, provenance, correction, custody, or review surfaces.',
              '',
              'Correction surface:',
              'https://github.com/josephusm/the-procedure/issues',
              '',
              'SHA-256:',
          ]
          for rel in files:
              path = root / rel
              if not path.exists():
                  raise SystemExit(f'missing manifest file: {rel}')
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              lines.append(f'{digest}  {rel}')
          lines.append('')
          Path('artifact-manifest.txt').write_text('\n'.join(lines))
          PY

      - name: Upload static artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
