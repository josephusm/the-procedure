name: Public trace / provenance discrepancy
about: A source, status, review-window, maintenance, deprecation/exit route, recovery route, review-response/reopen route, rule-genealogy parent-pressure trace, privacy, sitemap, metadata, or deployment trace is missing, inconsistent, or not plainly readable.
title: "Trace: "
labels: [public-trace]
body:
  - type: markdown
    attributes:
      value: |
        Use this for the dull handles around the game: canonical URL, metadata, sitemap, status, provenance, maintenance custody, deprecation/exit route, recovery route, review-response/reopen route, rule-genealogy parent-pressure trace, privacy boundary, source repository, issue surface, or review window.

        The correction surface matters only if a filed trace can be compared with the source that produced the public object and opened to public response, contested response, correction, roll-forward, or rollback. If a public trace requires client ceremony, login, JavaScript, or repository literacy before it can be read, that is a discrepancy too. Boring, yes. That is the point.
  - type: dropdown
    id: trace_surface
    attributes:
      label: Trace surface
      options:
        - index.html metadata / JSON-LD
        - sitemap.xml
        - robots.txt
        - status.txt
        - provenance.txt
        - review-window.txt
        - maintenance.txt
        - continuity exit / deprecation notice
        - successor URL / archived fallback
        - recovery route / rollback handle
        - review response / contested closure
        - rule genealogy / parent pressure
        - privacy.txt
        - README.md
        - GitHub Pages workflow
        - GitHub issue surface
        - Other
    validations:
      required: true
  - type: textarea
    id: discrepancy
    attributes:
      label: Discrepancy
      description: What is missing, stale, inconsistent, not inspectable, or not plainly readable?
      placeholder: status.txt says..., metadata points to..., live provenance does not match...
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence / URL
      description: Paste the URL, file path, source revision, or observed value.
    validations:
      required: true
  - type: textarea
    id: release_relevance
    attributes:
      label: Why it matters before 1.0.0
      description: What would this prevent a future player, crawler, archive, or maintainer from reading, checking, answering publicly, naming the parent signal behind a rule change, correcting, receiving notice about, handing off, rolling forward, or rolling back?
    validations:
      required: true
  - type: checkboxes
    id: standing
    attributes:
      label: Pre-release standing
      options:
        - label: This was found before 1.0.0 and should be reviewed before release.
          required: true
