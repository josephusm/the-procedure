name: Public trace / provenance discrepancy
about: A source, status, review-window, maintenance, recovery route, privacy, sitemap, metadata, or deployment trace is missing or inconsistent.
title: "Trace: "
labels: [public-trace]
body:
  - type: markdown
    attributes:
      value: |
        Use this for the dull handles around the game: canonical URL, metadata, sitemap, status, provenance, maintenance custody, recovery route, privacy boundary, source repository, issue surface, or review window.

        The correction surface matters only if a filed trace can be compared with the source that produced the public object and opened to correction, roll-forward, or rollback. Boring, yes. That is the point.
  - type: dropdown
    id: trace_surface
    attributes:
      label: Trace surface
      options:
        - index.html metadata / JSON-LD
        - sitemap.xml
        - robots.txt
        - status.txt
        - provenance.txt
        - review-window.txt
        - maintenance.txt
        - recovery route / rollback handle
        - privacy.txt
        - README.md
        - GitHub Pages workflow
        - GitHub issue surface
        - Other
    validations:
      required: true
  - type: textarea
    id: discrepancy
    attributes:
      label: Discrepancy
      description: What is missing, stale, inconsistent, or not inspectable?
      placeholder: status.txt says..., metadata points to..., live provenance does not match...
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence / URL
      description: Paste the URL, file path, source revision, or observed value.
    validations:
      required: true
  - type: textarea
    id: release_relevance
    attributes:
      label: Why it matters before 1.0.0
      description: What would this prevent a future player, crawler, archive, or maintainer from checking, correcting, rolling forward, or rolling back?
    validations:
      required: true
  - type: checkboxes
    id: standing
    attributes:
      label: Pre-release standing
      options:
        - label: This was found before 1.0.0 and should be reviewed before release.
          required: true
